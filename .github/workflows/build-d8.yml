name: Build d8 (Windows)

on:
  workflow_dispatch:
    inputs:
      v8_version:
        description: 'V8 commit hash or version (e.g., 74b1be3dced3478c21e44fff3746b3480206d76d). Leave empty for latest.'
        required: false
        default: ''
        type: string
      build_type:
        description: 'debug or release'
        required: false
        default: 'debug'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup depot_tools
        shell: bash
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          # depot_tools git_cache.py hardcodes 'git.bat' on Windows, but the
          # file was removed from the repo. Create a shim that forwards to the
          # system git so gclient can run.
          printf '@echo off\r\n"C:\\\\Program Files\\\\Git\\\\bin\\\\git.exe" %%*\r\n' > depot_tools/git.bat
          echo "$GITHUB_WORKSPACE/depot_tools" >> "$GITHUB_PATH"
          echo 'C:\Program Files\Git\cmd' >> "$GITHUB_PATH"
          echo 'C:\Program Files\Git\bin' >> "$GITHUB_PATH"
          echo "DEPOT_TOOLS_WIN_TOOLCHAIN=0" >> "$GITHUB_ENV"
          echo "DEPOT_TOOLS_UPDATE=0" >> "$GITHUB_ENV"
          echo "V8_VERSION=${{ github.event.inputs.v8_version }}" >> "$GITHUB_ENV"
          echo "BUILD_TYPE=${{ github.event.inputs.build_type }}" >> "$GITHUB_ENV"
          echo "OUT_DIR=out/${{ github.event.inputs.build_type }}" >> "$GITHUB_ENV"

      - name: Fetch V8 source
        shell: bash
        run: |
          set -e
          mkdir -p build && cd build
          fetch v8
          cd v8
          if [ -n "$V8_VERSION" ]; then
            if ! git checkout "$V8_VERSION" 2>/tmp/coerr; then
              cat /tmp/coerr
              git fetch origin "$V8_VERSION"
              git checkout FETCH_HEAD
            fi
            # Re-sync deps for this specific commit.
            gclient sync
          fi
          echo "V8_COMMIT=$(git log -1 --format='%H')" >> "$GITHUB_ENV"
          echo "V8_COMMIT_SHORT=$(git log -1 --format='%h')" >> "$GITHUB_ENV"
          git log -1 --format='%s' > /tmp/v8_commit_msg.txt

      - name: Generate build files
        shell: bash
        run: |
          cd build/v8
          export PATH="$PWD/buildtools/win:$PATH"
          if [ "$BUILD_TYPE" = "debug" ]; then
            GN_ARGS="is_debug=true symbol_level=2 v8_enable_sandbox=false v8_optimized_debug=false v8_enable_backtrace=true v8_enable_disassembler=true v8_enable_object_print=true"
          else
            GN_ARGS="is_debug=false symbol_level=1 v8_enable_sandbox=false v8_enable_backtrace=true v8_enable_disassembler=true v8_enable_object_print=true v8_optimized_debug=true"
          fi
          gn gen "$OUT_DIR" --args="$GN_ARGS"

      - name: Build d8
        shell: bash
        run: |
          cd build/v8
          export PATH="$PWD/buildtools/win:$PATH"
          ninja -C "$OUT_DIR" d8

      - name: Upload d8.exe
        uses: actions/upload-artifact@v4
        with:
          name: d8-${{ env.V8_COMMIT_SHORT }}-${{ env.BUILD_TYPE }}-win64
          path: |
            build/v8/${{ env.OUT_DIR }}/d8.exe
            build/v8/${{ env.OUT_DIR }}/*.pdb
            build/v8/${{ env.OUT_DIR }}/*.dll
            build/v8/${{ env.OUT_DIR }}/icudtl.dat
            build/v8/${{ env.OUT_DIR }}/snapshot_blob.bin
            build/v8/${{ env.OUT_DIR }}/natives_blob.bin
          retention-days: 90

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v8-${{ env.V8_COMMIT_SHORT }}-${{ env.BUILD_TYPE }}
          name: V8 d8 (${{ env.BUILD_TYPE }} win64) - ${{ env.V8_COMMIT_SHORT }}
          body: |
            **V8 Commit:** `${{ env.V8_COMMIT_SHORT }}`
            **Build Type:** ${{ env.BUILD_TYPE }}
            **Build Date:** ${{ github.event.repository.updated_at }}
            Windows x64 ${{ env.BUILD_TYPE }} d8 for vulnerability research.
            Extract all files to the same directory (d8.exe needs the V8 DLLs, icudtl.dat, snapshot_blob.bin and natives_blob.bin).
          files: |
            build/v8/${{ env.OUT_DIR }}/d8.exe
            build/v8/${{ env.OUT_DIR }}/*.pdb
            build/v8/${{ env.OUT_DIR }}/*.dll
            build/v8/${{ env.OUT_DIR }}/icudtl.dat
            build/v8/${{ env.OUT_DIR }}/snapshot_blob.bin
            build/v8/${{ env.OUT_DIR }}/natives_blob.bin
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
